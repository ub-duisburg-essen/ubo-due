orcid.integration.more.ude                     = You can find more information about linking your ORCID\u00AE-profile with the university bibliography here: 
orcid.integration.publish                      = import and update publication data from the university bibliography into your ORCID\u00AE profile regularly
orcid.integration.pending.intro                = Your ORCID\u00AE iD is a persistent, personal identifier that distinguishes you from other researchers and provides mechanisms for linking your research outputs and activities. ORCID\u00AE is already integrated into many systems used by publishers, funders, institutions and other research-related services. \r\n
