orcid.integration.unlink.success               = ORCID\u00AE {0} was unlinked.
orcid.integration.settings.alwaysUpdateWork    = Automatically transfer changes to my publications in the UBO to my ORCID\u00AE profile. This applies only to publications that have already been transferred from the UBO to my ORCID\u00AE profile.
orcid.integration.settings.createDuplicateWork = Automatically transfer publications that already exist in my ORCID\u00AE profile from the UBO to my ORCID\u00AE profile anyway, and group the identical publications in my ORCID\u00AE profile based on their identifier (e.g., DOI). The origin of the individual records remains traceable. If this option is disabled, the publication will not be transferred to my ORCID\u00AE profile.
orcid.integration.settings.createFirstWork     = Always automatically transfer newly created publications in the UBO to my ORCID\u00AE profile.
orcid.integration.settings.recreateDeletedWork = Restore publications deleted from my ORCID\u00AE profile that were imported from UBO to my ORCID\u00AE profile if they are saved to UBO again. If this option is not enabled, publications deleted from your ORCID\u00AE profile will remain permanently removed.
