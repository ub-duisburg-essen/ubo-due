listWizard.info.text2  = <h3>Publication lists for Imperia pages</h3><p>On webpages of UDE which are built using the content management system <a href="https://www.uni-due.de/zim/services/cms/" target="_blank">Imperia</a>, you can easily activate the <strong>Imperia module "Mitarbeiter-Publikationsliste"</strong> to integrate your personal publication list on any webpage.</p><p> This Imperia module can include a person's publication list by entering the LSF ID. However, more complex search queries or the URLs of hit lists from the university bibliography can be used as search strings. <br> Help on using the module can be found on the Imperia help pages - or ask us: <a href="mailto:bibliographie.ub@uni-due.de">bibliographie.ub@uni-due.de</a></p><h3>Transfer publications to your ORCID profile</h3><p>Do you have an <a href="https://orcid.org/" target="_blank">ORCID</a> profile and want to maintain your publication list just once? Then enter all your publications in the university bibliography and make us your "Trusted Party".</p><p>Find out how it works <a href="info.xml">here</a>.</p>

