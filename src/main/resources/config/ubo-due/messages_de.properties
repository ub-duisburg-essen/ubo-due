listWizard.info.text2  = <h3>Publikationslisten f\u00FCr Imperia-Seiten</h3><p>In UDE-Webseiten, die mit dem Content-Management-System <a href="https://www.uni-due.de/zim/services/cms/" target="_blank">Imperia</a> erstellt sind, kann ganz einfach durch Aktivierung des <strong>Moduls "Mitarbeiter-Publikationsliste"</strong> eine Publikationsliste eingebunden werden.</p><p> Dieses Imperia-Modul kann die Publikationsliste einer Person durch Eingabe der LSF-ID einbinden. Es k\u00F6nnen aber auch komplexere Suchanfragen oder die URLs von Trefferlisten aus der Universit\u00E4tsbibliographie als Suchstring verwendet werden. <br> Hilfe zur Nutzung des Moduls finden Sie auf den <a href="https://imperia.uni-due.de/imperia-hilfe/flex/_portal_publikationen.php">Imperia-Hilfe-Seiten</a> oder fragen Sie uns: <a href="mailto:bibliographie.ub@uni-due.de">bibliographie.ub@uni-due.de</a></p><h3>Publikationen ins eigene ORCID-Profil \u00FCbertragen</h3><p>Sie haben ein <a href="https://orcid.org/" target="_blank">ORCID</a>-Profil und m\u00F6chten Ihre Publikationsliste nur einmal pflegen? Dann melden Sie alle Ihre Publikationen der Universit\u00E4tsbibliographie und machen uns zur "Trusted Party".</p><p>Wie das funktioniert, finden Sie <a href="info.xml">hier</a>.</p>

orcid.integration.beta           = Das ORCID-Feature ist noch in der Testphase!\r\n
orcid.integration.beta.feedback  = Helfen Sie uns, unseren Service zu verbessern und melden Sie sich mit Fragen und Feedback bei uns: \r\n
orcid.integration.confirmed.text = Sie haben die Universit\u00E4tsbibliothek Duisburg-Essen als "Trusted Party" autorisiert,\r\nauf Ihr ORCID\u00AE-Profil zuzugreifen. Sie k\u00F6nnen diese Berechtigung \u00FCbrigens jederzeit in Ihrem ORCID\u00AE-Profil unter [Account Settings] > [Trusted organizations] widerrufen. Wir k\u00F6nnen nun\r\n
orcid.integration.pending.intro  = Ihre ORCID\u00AE-iD ist ein dauerhafter, pers\u00F6nlicher Identifikator, der Sie eindeutig von anderen Wissenschaftler*innen unterscheidbar macht und Mechanismen bietet, Ihre Forschungsergebnisse und Aktivit\u00E4ten zu verkn\u00FCpfen. ORCID\u00AE ist bereits in vielen Systemen von F\u00F6rderern, Institutionen, Verlagen, Datenbanken und anderen wissenschaftlichen Diensten integriert.\r\n
